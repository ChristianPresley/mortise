---
layout: default
---
<h1>{{ site.title }}</h1>
{% if site.description %}<p class="lead">{{ site.description }}</p>{% endif %}
{{ content }}
<ul class="posts">
{%- for post in site.posts %}
<li><a href="{{ post.url }}">{{ post.title }}</a> <small>{{ post.date | date }}</small></li>
{%- endfor %}
</ul>
