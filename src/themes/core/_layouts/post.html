---
layout: default
---
<article>
<h1>{{ page.title }}</h1>
<p class="meta">{{ page.date | date }}{% for tag in page.tags %} <span class="tag">{{ tag }}</span>{% endfor %}</p>
{{ content }}
</article>
<nav class="pager">
{%- if page.previous %}<a class="prev" href="{{ page.previous.url }}"><small>Previous</small>{{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
{%- if page.next %}<a class="next" href="{{ page.next.url }}"><small>Next</small>{{ page.next.title }}</a>{% endif %}
</nav>
