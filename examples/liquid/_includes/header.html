<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
    <nav>
      {%- for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if item.url == include.current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
