# A Jekyll-style site written in Liquid. Build it with:
#   zig build run -- build examples/liquid
# `liquid: true` makes templates and Markdown bodies Liquid, as in Jekyll.
liquid: true
title: Field Notes
description: Short notes from a workshop, written the way a Jekyll site is
author: Ada Fernhill
url: https://example.com

# Posts publish under their category, then year; pages get a folder each.
permalink: /:categories/:year/:title/

# Front matter defaults: posts and tools get their layouts without saying
# so, and the sketches in assets/img are marked as images.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      type: tools
    values:
      layout: page
  - scope:
      path: assets/img
    values:
      image: true

# Collections: _tools/ is published at /tools/NAME/; _glossary/ is only
# listed, as site.glossary.
collections:
  tools:
    output: true
    sort_by: order
  glossary:
