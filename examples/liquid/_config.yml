# A Jekyll-style site written in Liquid. Build it with:
#   zig build run -- build examples/liquid
# `liquid: true` makes templates and Markdown bodies Liquid, as in Jekyll.
liquid: true
title: Field Notes
description: Short notes from a workshop, written the way a Jekyll site is
author: Ada Fernhill
url: https://example.com

# Front matter defaults: every post gets the post layout without saying so.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      type: tools
    values:
      layout: page

# Collections: _tools/ is published at /tools/NAME/; _glossary/ is only
# listed, as site.glossary.
collections:
  tools:
    output: true
    sort_by: order
  glossary:
