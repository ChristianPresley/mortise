# A site that exercises every Mortise feature. Build it with:
#   zig build run -- build examples/showcase
title: Mortise Showcase
description: Every Mortise feature on one small site
author: The Mortise authors
url: https://example.com
# Optional built-in theme: visor (helmet HUD) or lcars (starship console).
theme: visor
# Last-updated dates from the Git history, and an edit link on every page.
git_dates: true
edit_url: https://github.com/ChristianPresley/mortise/edit/main/{path}
# Favicon, app icons and web manifest, drawn in the theme's style.
icons:
  letters: M
