# A site that exercises every Mortise feature. Build it with:
#   zig build run -- build examples/showcase
title: Mortise Showcase
description: Every Mortise feature on one small site
author: The Mortise authors
url: https://example.com
# Optional built-in theme: visor (helmet HUD) or lcars (starship console).
theme: visor
# Last-updated dates from the Git history, and an edit link on every page.
git_dates: true
edit_url: https://github.com/ChristianPresley/mortise/edit/main/{path}
# Favicon, app icons and web manifest, drawn in the theme's style.
icons:
  letters: M
# Site search: an index and a Ctrl+K dialog, see docs/search.md.
search: true
# Extra taxonomies besides tags; each gets /NAME/ and /NAME/TERM/ pages.
taxonomies: [categories]
# page.related lists up to this many posts sharing tags or categories.
related: 3
# Image tags get width/height and lazy loading; JPEG and PNG images also get
# resized copies at these widths for srcset.
images:
  widths: [480, 960]
# llms.txt, llms-full.txt and a Markdown twin of every Markdown page.
llms: true
# feed.json beside feed.xml.
json_feed: true
