<p>Indented code is a paragraph.</p>
<p>&lt;div&gt;raw html is escaped&lt;/div&gt;</p>
<ul>
<li>[ ] task lists are plain list items</li>
</ul>
<p>Footnotes[^1] are literal.</p>
<p>[^1]: Like this one.</p>
<p>Entities like &amp;copy; are escaped.</p>
<p>[reference links][ref] are literal.</p>
<p>[ref]: https://example.com</p>
