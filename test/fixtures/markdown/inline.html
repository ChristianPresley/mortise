<p>Text with <em>emphasis</em>, <em>also emphasis</em>, <strong>strong</strong>, <strong>also strong</strong>,
and <em><strong>both</strong></em>. A snake_case_word stays plain, and so does 2 * 3 * 4.</p>
<p>Inline <code>code with *stars*</code> and <code>code with a ` backtick</code>.</p>
<p>A <a href="https://example.com">link</a>, a <a href="/about/" title="About us">titled link</a>,
an <img src="/img/logo.png" alt="image" title="Logo" />, and a <a href="/x">link with <em>emphasis</em></a>.</p>
<p>Escapes: *not emphasis*, [not a link], and a literal \ backslash.</p>
